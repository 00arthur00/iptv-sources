name: Sync upstream

on:
  schedule:
    # 每天北京时间 06:17（UTC 22:17）自动同步一次
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/best-fan/iptv-sources.git
          git fetch upstream
          if git merge --no-edit upstream/main; then
            git push origin main
          else
            echo "::error::合并 upstream/main 时发生冲突，请手动解决"
            exit 1
          fi
